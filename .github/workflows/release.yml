name: release

# Releases are cut by adding a `## X.Y.Z` heading to CHANGELOG.md. Every other
# push to main stops at the gate below without building anything.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          # Tags are how the last released version is known; a shallow clone
          # has none, which would make every push look like a release.
          fetch-depth: 0

      - id: check
        run: |
          new=$(./deploy/version.sh)
          last=$(git tag --list 'v*' --sort=-v:refname | head -1 | sed 's/^v//')
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ -n "$last" ] && ! dpkg --compare-versions "$new" gt "$last"; then
            echo "CHANGELOG version $new is not ahead of released $last - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "releasing $new (previous: ${last:-none})"
          echo "release=true" >> "$GITHUB_OUTPUT"

  build:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - run: go test ./...

      # The build number always increases, so re-running after a failed
      # publish yields a strictly newer package rather than a collision.
      - run: ./deploy/build-deb.sh ${{ matrix.arch }} "${{ needs.gate.outputs.version }}+${{ github.run_number }}"
        env:
          MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
          REPO: ${{ github.repository }}

      - uses: actions/upload-artifact@v6
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb

  publish:
    needs: [gate, build]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate.outputs.version }}+${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Import signing key
        run: |
          echo "${{ secrets.APT_GPG_KEY }}" | gpg --batch --import
      - name: Build the apt repository
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils
          git fetch origin gh-pages && git worktree add repo origin/gh-pages \
            || git worktree add --orphan -b gh-pages repo
          cp dist/*.deb repo/
          cp deploy/livecaption-archive-keyring.asc repo/ 2>/dev/null || true
          cd repo
          # --multiversion keeps older releases installable, which is what
          # makes `apt install livecaption=<older>` work as a rollback.
          dpkg-scanpackages --multiversion . > Packages
          gzip -k9f Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=livecaption \
            -o APT::FTPArchive::Release::Label=livecaption \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            release . > Release
          gpg --batch --yes --default-key "${{ secrets.APT_GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "${{ secrets.APT_GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Push gh-pages
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "livecaption $VERSION" || exit 0
          git push origin HEAD:gh-pages

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "v${{ needs.gate.outputs.version }}"
          git push origin "v${{ needs.gate.outputs.version }}"
          gh release create "v${{ needs.gate.outputs.version }}" dist/*.deb \
            --title "v${{ needs.gate.outputs.version }}" \
            --notes "Build $VERSION from ${{ github.sha }}"
