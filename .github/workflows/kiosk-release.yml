name: kiosk release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency: apt-repository

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: check
        run: |
          new=$(./deploy-kiosk/version.sh)
          last=$(git tag --list 'kiosk-v*' --sort=-v:refname | head -1 | sed 's/^kiosk-v//')
          echo "version=$new" >> "$GITHUB_OUTPUT"
          if [ -n "$last" ] && ! dpkg --compare-versions "$new" gt "$last"; then
            echo "Kiosk changelog version $new is not ahead of released $last - nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "release=true" >> "$GITHUB_OUTPUT"

  publish:
    needs: gate
    if: needs.gate.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.gate.outputs.version }}+${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build kiosk package
        run: |
          sudo apt-get update && sudo apt-get install -y dpkg-dev apt-utils
          ./deploy-kiosk/build-deb.sh "$VERSION"
        env:
          MAINTAINER: ${{ github.repository_owner }} <${{ github.repository_owner }}@users.noreply.github.com>
          REPO: ${{ github.repository }}

      - name: Import signing key
        run: echo "${{ secrets.APT_GPG_KEY }}" | gpg --batch --import

      - name: Build apt repository
        run: |
          git fetch origin gh-pages && git worktree add repo origin/gh-pages \
            || git worktree add --orphan -b gh-pages repo
          cp dist/*.deb repo/
          cp deploy/livecaption-archive-keyring.asc repo/ 2>/dev/null || true
          cd repo
          dpkg-scanpackages --multiversion . > Packages
          gzip -k9f Packages
          apt-ftparchive \
            -o APT::FTPArchive::Release::Origin=livecaption \
            -o APT::FTPArchive::Release::Label=livecaption \
            -o APT::FTPArchive::Release::Suite=stable \
            -o APT::FTPArchive::Release::Codename=stable \
            release . > Release
          gpg --batch --yes --default-key "${{ secrets.APT_GPG_KEY_ID }}" -abs -o Release.gpg Release
          gpg --batch --yes --default-key "${{ secrets.APT_GPG_KEY_ID }}" --clearsign -o InRelease Release

      - name: Push gh-pages
        run: |
          cd repo
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "livecaption-kiosk $VERSION" || exit 0
          git push origin HEAD:gh-pages

      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git tag "kiosk-v${{ needs.gate.outputs.version }}"
          git push origin "kiosk-v${{ needs.gate.outputs.version }}"
          gh release create "kiosk-v${{ needs.gate.outputs.version }}" dist/*.deb \
            --title "livecaption-kiosk v${{ needs.gate.outputs.version }}" \
            --notes "Build $VERSION from ${{ github.sha }}"
