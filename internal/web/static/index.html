<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Live Captions</title>
<style>
  :root {
    --bg: #05070a;
    --fg: #f5f7fa;
    --dim: #7c8896;
    --warn: #f5a623;
    --bad: #ef4444;
    --ok: #22c55e;
    /* Benign non-streaming states (silence, music): blue reads as "nothing is
       wrong, just not captioning" where grey read as dead. */
    --info: #38bdf8;
    --size: 4vw;
    --row-h: 1.6em;
    /* Reserved unconditionally, never toggled: a gutter that appeared the
       first time a second speaker spoke reflowed every painted word
       sideways mid-sentence, which is exactly the class of motion this
       display exists to avoid. The cost of always reserving it is paid back
       by #page's negative margin below, which spends the body's own left
       padding on it instead of the text's width. */
    --gutter: calc(var(--row-h) * 0.5);
    /* Speaker badge palette, dark (default). 1/2/3 are the colour-vision-safe
       trio — blue vs. orange survives deuteranopia/protanopia, magenta
       separates from both — and two-or-three speakers is by far the common
       case, so they're spent on the colours that need to be distinguishable
       first. Every swatch here clears 10:1 against the near-black numeral. */
    --spk-1: #7dd3fc;
    --spk-2: #fdba74;
    --spk-3: #f0abfc;
    --spk-4: #6ee7b7;
    --spk-5: #c4b5fd;
    --spk-6: #bef264;
  }
  :root[data-theme="light"] {
    --bg: #f4f5f7;
    --fg: #0c0f14;
    --dim: #6b7280;
    --ok: #16a34a;
    --info: #0284c7;
    /* Every swatch here clears 4.9:1 against the near-white numeral. */
    --spk-1: #0369a1;
    --spk-2: #b45309;
    --spk-3: #a21caf;
    --spk-4: #047857;
    --spk-5: #6d28d9;
    --spk-6: #4d7c0f;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { height: 100dvh; }
  body {
    height: 100dvh;
    background: var(--bg);
    color: var(--fg);
    font: 400 1rem/1.3 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    display: flex;
    flex-direction: column;
    padding: 4vh 5vw calc(4vh + env(safe-area-inset-bottom, 0px)) 5vw;
    overflow: hidden;
    overscroll-behavior: none;
    touch-action: manipulation;
    -webkit-text-size-adjust: 100%;
    user-select: none;
  }

  @media (orientation: portrait) {
    :root { --size: 6.4vw; }
  }

  /* The caption area is bottom-anchored, fixed-height (#viewport) so a
     partial row can never be visible, and only ever moves via the one-row
     glide in JS (see freezeAndGlide). retypeset() is the only path that
     ever rebuilds row contents. */
  #page {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    /* The speaker badge lives in .row's left padding, so without this the
       whole caption block would sit a gutter's width right of where it used
       to — dead space in front of every line, paid for by every session
       whether or not anyone is diarized. Reaching back into body's own 5vw
       padding puts the badge in the margin instead, and leaves the text
       within ~1vw of its original position. Less than the full gutter on
       purpose: a full-width pull would park the badge flush against the
       screen edge in portrait. */
    margin-left: -3vw;
  }
  #viewport {
    overflow: hidden;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
  }
  #stack {
    display: flex;
    flex-direction: column;
  }

  /* Row geometry is exact and identical whether a row is empty or full, so
     the JS-measured --row-h always equals the glide's translate distance.
     No gap between rows: spacing lives entirely in line-height. */
  .row {
    position: relative;
    padding-left: var(--gutter, 0px);
    height: var(--row-h);
    line-height: var(--row-h);
    white-space: pre;
    overflow: hidden;
    font-weight: 600;
    font-size: clamp(1.35rem, var(--size), 7.5rem);
    /* Opacity VALUES live only in applyRowOpacities() in caption.js; this is
       just how they move. Duration MUST equal GLIDE_MS there, so a row's fade
       to its new age lands on the same frame as the stack's translate. */
    transition: opacity 130ms linear;
  }

  /* data-spk (cycled 1-6, ((speaker-1)%6)+1, set by caption.js) selects the
     colour; data-speaker (the true, uncycled number) both gates the badge's
     existence and supplies its glyph via attr() — so a 7th speaker reuses
     speaker 1's colour but still shows "7". */
  .row[data-spk="1"] { --spk: var(--spk-1); }
  .row[data-spk="2"] { --spk: var(--spk-2); }
  .row[data-spk="3"] { --spk: var(--spk-3); }
  .row[data-spk="4"] { --spk: var(--spk-4); }
  .row[data-spk="5"] { --spk: var(--spk-5); }
  .row[data-spk="6"] { --spk: var(--spk-6); }

  /* Absolutely positioned, not inline: with padding-left on a positioned
     .row, left:0 resolves to the padding box's left edge — inside the
     gutter, not clipped by .row's overflow:hidden — without shifting text
     by an amount the canvas measurement in computeMetrics() knows nothing
     about. */
  .row[data-speaker]::before {
    content: attr(data-speaker);
    position: absolute;
    left: 0;
    top: 50%;
    transform: translateY(-50%);
    width: calc(var(--gutter) * 0.74);
    height: calc(var(--gutter) * 0.74);
    border-radius: 50%;
    background: var(--spk);
    color: var(--bg);
    /* The numeral is the part that has to stay readable, so it takes most
       of the dot rather than floating in it. Shrinking the dot further is
       cheap; shrinking the digit is what makes the badge stop working. */
    font-size: 0.28em;
    line-height: calc(var(--gutter) * 0.74);
    font-weight: 700;
    text-align: center;
  }

  /* Words never change once painted (append-only client, commit-only wire),
     so the only thing color transitions here is the row-glide's opacity fade
     brushing past a word during its 200ms animation — not a state change. */
  .w { transition: color 180ms linear; color: var(--fg); }
  /* Non-speech marker (*music*, *silence*). Italic only: opacity belongs to
     applyRowOpacities in caption.js, and a per-span value multiplies against
     the row's, so the marker would never reach full opacity even while live. */
  .w.evt { font-style: italic; }

  /* Off-screen probe used only to read computed font metrics; never painted. */
  .row-probe {
    position: absolute;
    left: -9999px;
    top: 0;
    visibility: hidden;
    white-space: pre;
    pointer-events: none;
    font-weight: 600;
    font-size: clamp(1.35rem, var(--size), 7.5rem);
    line-height: 1.25;
  }

  #topbar {
    position: fixed;
    z-index: 11;
    display: flex;
    align-items: center;
    gap: 0.6rem;
    /* Spans the viewport with the logo pinned left and the status right, so
       the pill growing a label expands leftward into empty space instead of
       shoving the logo sideways. */
    justify-content: space-between;
    top: max(0.9rem, env(safe-area-inset-top, 0px));
    left: max(0.9rem, env(safe-area-inset-left, 0px));
    right: max(0.9rem, env(safe-area-inset-right, 0px));
    pointer-events: none;
  }
  #logo {
    height: clamp(3rem, 8vh, 6.5rem);
    max-width: 55vw;
    object-fit: contain;
    opacity: 0.92;
  }

  /* Connection indicator: a quiet dot when healthy, a labeled pill when not. */
  #status {
    display: flex;
    align-items: center;
    /* Dot last so it sits at the right edge and never moves; the label grows
       leftward from it. */
    flex-direction: row-reverse;
    gap: 0.5em;
    padding: 0.45em 0.45em;
    border-radius: 999px;
    font-size: 1.6rem;
    font-weight: 600;
    color: var(--fg);
    background: transparent;
    transition: background-color 0.25s, padding 0.25s;
    line-height: 1;
    max-width: 50vw;
  }
  #status .dot {
    width: 1.1rem;
    height: 1.1rem;
    min-width: 1.1rem;
    border-radius: 50%;
    background: var(--ok);
    box-shadow: 0 0 0 0.18rem color-mix(in srgb, var(--ok) 22%, transparent);
    transition: background-color 0.25s, box-shadow 0.25s;
  }
  #status .label { display: none; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Initial tier, before EventSource.onopen has fired: a page must never
     flash green before it actually knows it is connected. */
  #status.connecting .dot { background: var(--dim); box-shadow: none; }
  #status.warn { background: color-mix(in srgb, var(--warn) 22%, transparent); padding: 0.3em 0.7em; }
  #status.warn .dot { background: var(--warn); box-shadow: none; }
  #status.warn .label { display: inline; color: var(--warn); }
  #status.bad { background: color-mix(in srgb, var(--bad) 22%, transparent); padding: 0.3em 0.7em; }
  #status.bad .dot { background: var(--bad); box-shadow: none; }
  #status.bad .label { display: inline; color: var(--bad); }
  /* Auto-pause: the recognizer link closed itself after a stretch of
     silence, which is expected, money-saving behaviour, not a fault — so
     this tier borrows --info rather than --warn/--bad and must never read
     as an error. */
  #status.idle { background: color-mix(in srgb, var(--info) 22%, transparent); padding: 0.3em 0.7em; }
  #status.idle .dot { background: var(--info); box-shadow: none; }
  #status.idle .label { display: inline; color: var(--info); }
  /* Music: the recognizer is hearing singing, captions are suppressed so a
     frozen row doesn't look broken. Own tier rather than reusing warn/bad —
     this is expected, not a fault — and it wins over connection state below,
     since the reason the screen is frozen matters more than the link health
     that isn't the cause of it. */
  #status.music { background: color-mix(in srgb, var(--info) 22%, transparent); padding: 0.3em 0.7em; }
  #status.music .dot { background: var(--info); box-shadow: none; }
  #status.music .label { display: inline; color: var(--info); }

  /* Backend B's silent looping video. Both engines gate the screen-on
     grant on the element's geometry or its tracks, not on playback alone,
     so this rule is load-bearing:
       Blink (VideoWakeLock::ShouldBeActive) wants the video >=75% onscreen
       AND covering >20% of the viewport (kSizeThreshold), unless it is
       audible — hence full-bleed rather than the 1px sentinel it used to be.
       Gecko (HTMLVideoElement::ShouldCreateVideoWakeLock) instead wants the
       file to carry an audio track; see the wake.* assets.
     Kept at .01 opacity behind the content (never display:none, which would
     zero the intersection rects and forfeit the Blink grant). */
  #wakevid {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    z-index: -1;
    opacity: .01;
    pointer-events: none;
  }
  /* Blocking tap gate shown only when Backend B needs its one user gesture. */
  #gate {
    position: fixed;
    inset: 0;
    z-index: 10;
    background: var(--bg);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 0.8em;
    text-align: center;
    padding: 0 8vw;
  }
  #gate:not([hidden]) { display: flex; }
  #gate button {
    font: inherit;
    font-size: 1.15rem;
    font-weight: 700;
    color: var(--bg);
    background: var(--fg);
    border: none;
    border-radius: 0.6rem;
    padding: 0.9em 1.7em;
    cursor: pointer;
  }
  #gate .gate-sub {
    color: var(--dim);
    font-size: 0.9rem;
    max-width: 60ch;
  }
</style>
</head>
<body>
  <div id="topbar">
    <img id="logo" alt="" hidden>
    <div id="status" class="connecting" role="status" aria-live="polite"><span class="dot"></span><span class="label"></span></div>
  </div>
  <div id="page"><div id="viewport"><div id="stack"></div></div></div>
  <!-- Long enough that the canvas-vs-layout width calibration in
       computeMetrics() is not dominated by per-glyph rounding. -->
  <div class="row-probe" id="probe" aria-hidden="true">The quick brown fox jumps over the lazy dog, 0123456789</div>

  <!-- Backend B (silent looping video) wake-lock technique: kept playing
       while the tab is visible. Must stay rendered (see CSS), never
       display:none, or autoplay/screen-on eligibility is lost. The assets
       carry a silent audio track, which Gecko requires before it will grant
       the lock at all and WebKit requires before it will call the element
       audible. No loop attribute on purpose: WebKit's shouldDisableSleep()
       returns None for any element with loop() set, so the loop is done by
       seeking instead (see wakeLoopBack). -->
  <video id="wakevid" muted playsinline webkit-playsinline disablepictureinpicture preload="auto" aria-hidden="true">
    <!-- ?v= is a cache-buster, not a route: the handler ignores the query.
         These URLs went out once with an immutable year-long Cache-Control,
         so a phone that loaded the page back then would never re-ask for the
         asset, and would keep using a copy with no audio track. Bump it
         whenever the asset bytes change. -->
    <source src="/wake.mp4?v=2" type="video/mp4">
    <source src="/wake.webm?v=2" type="video/webm">
  </video>
  <div id="gate" hidden>
    <button id="gatebtn" type="button">Tap to start</button>
    <div class="gate-sub">Tap to start captions</div>
  </div>

<script src="/caption.js"></script>
<script>
(function () {
  "use strict";
  var params = new URLSearchParams(location.search);

  // ?theme=light — default is dark, everything else is opt-in.
  if (params.get("theme") === "light") {
    document.documentElement.setAttribute("data-theme", "light");
  }

  // ?size=N — base font size in vw, clamped in CSS so extreme values stay legible.
  var sizeParam = parseFloat(params.get("size"));
  if (!isNaN(sizeParam) && sizeParam > 0) {
    document.documentElement.style.setProperty("--size", sizeParam + "vw");
  }

  // Default: as many rows as the page is tall — CaptionStack clamps
  // requestedLines to what actually fits (adjustMaxRows), so a number no
  // screen can reach means "fill the screen". ?lines=N is the per-viewer
  // override (a phone and a projector want different counts from the same
  // server), so nothing here varies per deployment and the page can lay
  // itself out without waiting on a fetch.
  var DEFAULT_LINES = 5;
  var linesParamNum = parseInt(params.get("lines"), 10);
  var requestedLines = (!isNaN(linesParamNum) && linesParamNum > 0) ? linesParamNum : DEFAULT_LINES;
  var wakeDisabled = params.get("wake") === "0";

  var page = document.getElementById("page");
  var viewport = document.getElementById("viewport");
  var stack = document.getElementById("stack");
  var probe = document.getElementById("probe");
  var logoEl = document.getElementById("logo");
  var statusEl = document.getElementById("status");
  var statusLabel = statusEl.querySelector(".label");

  // ---- clock offset estimation ----
  // ev.at is the server's own wall clock; comparing it against this page's
  // Date.now() without correction would measure the phone's clock skew
  // (routinely seconds off on a device that's never synced NTP) instead of
  // the network-plus-render latency the viewer-latency figure is meant to
  // capture. Standard NTP-style measurement: t0/t1 bracket the round trip,
  // the midpoint approximates when the server's clock read serverNow, and
  // among several samples the lowest RTT is kept because the shortest round
  // trip has the least asymmetry between the two legs, and is therefore the
  // least biased estimate of the offset.
  var clockOffsetMs = 0;
  var clockOffsetKnown = false;
  var clockOffsetRTT = Infinity;

  function sampleClockOffset() {
    var t0 = Date.now();
    fetch("/api/time").then(function (r) { return r.json(); }).then(function (body) {
      var t1 = Date.now();
      var rtt = t1 - t0;
      var serverNow = Date.parse(body && body.now);
      if (isNaN(serverNow) || rtt >= clockOffsetRTT) return;
      clockOffsetRTT = rtt;
      clockOffsetMs = serverNow - (t0 + t1) / 2;
      clockOffsetKnown = true;
    }).catch(function () { /* offline: keep the last known offset rather than guessing */ });
  }

  var CLOCK_STARTUP_SAMPLES = 5;
  for (var clockI = 0; clockI < CLOCK_STARTUP_SAMPLES; clockI++) {
    setTimeout(sampleClockOffset, clockI * 150);
  }
  setInterval(sampleClockOffset, 60000);

  // ---- viewer paint latency: this page's own measurement of publish->paint,
  // POSTed back to the server so /admin can show the one leg of the pipeline
  // the server has no visibility into. Telemetry only — a failure here must
  // never affect caption rendering, so every step below swallows its errors.
  var lastViewerReportAt = 0;
  var VIEWER_REPORT_MIN_INTERVAL_MS = 1000;

  function sendViewerLatency(paintMs) {
    var payload = JSON.stringify({ paint_ms: paintMs });
    try {
      if (navigator.sendBeacon) {
        navigator.sendBeacon("/api/viewer-latency", new Blob([payload], { type: "application/json" }));
      } else {
        fetch("/api/viewer-latency", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: payload,
          keepalive: true
        }).catch(function () {});
      }
    } catch (err) { /* telemetry must never break caption rendering */ }
  }

  // Called by the typesetter (opts.onPainted) at the moment a segment's first
  // word actually reaches the DOM — NOT when the SSE event arrives. Those are
  // the same instant only when the paced queue is empty; with a backlog they
  // are seconds apart, and the gap is precisely the lag a reader complains
  // about. Measuring at arrival is what used to pin this figure at ~1ms while
  // the display ran visibly behind.
  function reportPaint(publishedAt) {
    // rAF fires for the first frame after the DOM write pushWord just made,
    // which is what "paint" means here — not the drain() tick it ran in.
    requestAnimationFrame(function () {
      var paintMs = (Date.now() + clockOffsetMs) - publishedAt;
      // Don't report until an offset has actually been measured. Until then
      // clockOffsetMs is 0, which silently means "assume this phone's clock
      // agrees with the server's" — and a device running a couple of seconds
      // BEHIND would produce a plausible-looking multi-second figure that
      // passes the server's range check and drags the viewer p95 up. A phone
      // running ahead is harmless by luck (negative, so rejected); this guard
      // is what makes the other direction safe too. The startup burst settles
      // within about a second, so this only skips the first event or two.
      if (!clockOffsetKnown) return;
      var now = Date.now();
      if (now - lastViewerReportAt < VIEWER_REPORT_MIN_INTERVAL_MS) return;
      lastViewerReportAt = now;
      sendViewerLatency(paintMs);
    });
  }

  // ---- caption typesetter ----
  // The rolling-display / pause-break typesetter itself lives in the shared
  // caption.js (loaded below), so /admin can mount the exact same code and
  // is guaranteed to render identically rather than drifting from a second
  // copy.
  var captionStack = window.CaptionStack({
    stack: stack,
    viewport: viewport,
    page: page,
    probe: probe,
    requestedLines: requestedLines,
    onPainted: reportPaint
  });

  var retypesetTimer = null;
  function scheduleRetypeset() {
    if (retypesetTimer) clearTimeout(retypesetTimer);
    retypesetTimer = setTimeout(function () {
      retypesetTimer = null;
      captionStack.retypeset();
    }, 120);
  }

  if (window.ResizeObserver) {
    new ResizeObserver(scheduleRetypeset).observe(page);
  }
  if (window.visualViewport) {
    window.visualViewport.addEventListener("resize", scheduleRetypeset);
  }
  window.addEventListener("orientationchange", scheduleRetypeset);

  // ---- config: the logo, which only the server knows was supplied ----
  fetch("/api/config").then(function (r) { return r.json(); }).then(function (cfg) {
    if (!cfg) return;
    if (cfg.logo && params.get("logo") !== "0") {
      logoEl.onerror = function () { logoEl.hidden = true; };
      logoEl.src = cfg.logo;
      logoEl.hidden = false;
    }
  }).catch(function () { /* fall back to default silently */ });

  // ---- connection indicator ----
  // Two signals feed it: the browser's own EventSource state (onopen/onerror),
  // and upstream "status" events the server relays about the STT link. The
  // more severe of the two wins. sseOpen starts null ("connecting") so the
  // dot cannot flash green before onopen actually fires.
  var sseOpen = null;
  var hubState = null;
  var musicOn = false;

  function applyIndicator() {
    var tier = "ok", text = "";
    if (sseOpen === null) {
      tier = "connecting";
    } else if (!sseOpen) {
      tier = "bad";
      text = "disconnected";
    } else if (musicOn) {
      // Wins over connection state: it explains a frozen screen on an
      // otherwise-healthy link, which matters more than that link's own
      // state while it's the reason nothing is moving.
      tier = "music";
      text = "♪ music";
    } else if (hubState === "reconnecting" || hubState === "connecting") {
      tier = "warn";
      text = hubState === "connecting" ? "connecting" : "reconnecting";
    } else if (hubState === "closed") {
      tier = "bad";
      text = "closed";
    } else if (hubState === "paused") {
      // Auto-pause: the room went quiet and the recognizer link closed
      // itself to stop billing. Correct, expected behaviour — "silence",
      // matching the *silence* caption marker, rather than an alarming or
      // technical word; the blue dot carries the rest.
      tier = "idle";
      text = "silence";
    }
    statusEl.classList.toggle("connecting", tier === "connecting");
    statusEl.classList.toggle("warn", tier === "warn");
    statusEl.classList.toggle("bad", tier === "bad");
    statusEl.classList.toggle("idle", tier === "idle");
    statusEl.classList.toggle("music", tier === "music");
    statusLabel.textContent = text;
  }

  // SSE rather than WebSocket because the traffic is strictly one-way.
  // EventSource only honours the server's `retry:` directive while it is in
  // CONNECTING. A hard failure — server process gone, connection refused —
  // parks it in CLOSED, where it never retries again, and a backgrounded tab
  // (Firefox throttles hidden-tab timers hardest) is the likeliest way to get
  // there. So reconnection is ours: rebuild the object on CLOSED.
  var es = null;
  var retryTimer = null;

  function connect() {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    if (es) es.close();  // never leave two streams open
    es = new EventSource("/events");
    es.onopen = onOpen;
    es.onerror = onError;
    es.onmessage = onMessage;
  }

  function onOpen() {
    if (retryTimer) { clearTimeout(retryTimer); retryTimer = null; }
    sseOpen = true;
    applyIndicator();
  }

  function onError() {
    sseOpen = false;
    applyIndicator();
    // CONNECTING means the browser is still retrying on its own; leave it be.
    if (es.readyState === EventSource.CLOSED && !retryTimer) {
      retryTimer = setTimeout(function () { retryTimer = null; connect(); }, 3000);
    }
  }

  function onMessage(e) {
    var ev;
    try { ev = JSON.parse(e.data); } catch (err) { return; }
    switch (ev.kind) {
      case "caption":
        if (ev.break) captionStack.breakRow();
        // ev.at is the server's publish time. An absent or unparseable one
        // parses to NaN, which appendSegment's `> 0` guard drops, so such a
        // segment simply reports no latency.
        captionStack.appendSegment(ev.words, ev.speaker, Date.parse(ev.at));
        break;
      // The first event on every connection is a status carrying the server's
      // last-known state, so a client that (re)connects mid-pause shows the
      // right indicator immediately instead of sitting on hubState's initial
      // null and rendering a plain "ok" dot until something changes — which,
      // during a pause, may be never. Nothing is replayed but the state: a
      // late joiner starts from the next caption.
      case "status":
        var prevState = hubState;
        hubState = ev.state || null;
        // Auto-pause is the room actually going quiet (--silence-hold), so it
        // gets an in-stream marker as well as the indicator. Only on a real
        // transition from a known previous state: Subscribe replays the
        // current state as the first event on every connection, and a
        // reconnect mid-pause must not inject a second marker.
        if (hubState === "paused" && prevState !== null && prevState !== "paused") {
          captionStack.pushEvent("— silence —");
        }
        applyIndicator();
        return;
      // Music suppression: the server has stopped publishing captions, so
      // the last row simply stops growing — the marker (and the indicator)
      // is the only thing that explains why. Leading edge only; the next
      // caption ends it implicitly.
      case "music":
        var wasMusic = musicOn;
        musicOn = ev.state === "on";
        if (musicOn && !wasMusic) captionStack.pushEvent("♪ music ♪");
        applyIndicator();
        return;
      // The operator pressed clear on the admin page. No marker and no
      // indicator change: the screen going blank is the whole message, and
      // anything left behind would defeat the point of removing the text.
      case "clear":
        captionStack.clear();
        return;
      default:
        return;
    }
    applyIndicator();
  }

  connect();

  // ---- screen wake lock: a phone sleeping mid-event is the most likely
  // real-world failure of this interface. The Wake Lock API is secure-
  // context only and this server has no TLS, so plain HTTP falls back to a
  // silent looping video (the NoSleep.js technique), which needs one user
  // gesture before playback is permitted. Playing is necessary but not
  // sufficient: each engine has its own eligibility test for turning
  // playback into a screen-on grant (full-bleed geometry for Blink, an
  // audio track in the file for Gecko) — see the #wakevid CSS. ?wake=0
  // disables the feature entirely, gate included — required for OBS browser
  // sources and wall-mounted projectors, which nobody is present to tap. ----
  var wakeBackend = "off";  // "off" | "api" | "video"
  // WebKit — every iOS browser, plus Safari — is the one engine that needs
  // the element to be genuinely audible: shouldDisableSleep() only returns
  // Display when mediaType() is VideoAudio, and computeCanProduceAudio()
  // returns false for a muted element or a zero volume. The track is
  // digital silence so nothing is heard, but an unmuted element does claim
  // the audio session, which is why every other engine keeps its mute:
  // Blink grants the lock on geometry alone (see the #wakevid CSS) and
  // Gecko on the mere presence of an audio track, neither of which costs a
  // phone its music.
  var wakeNeedsAudible = /AppleWebKit/.test(navigator.userAgent) &&
                         !/Chrom|Android|Edg\/|OPR\//.test(navigator.userAgent);
  var wakeHeld = false;
  var wakeAwaitingTap = false;
  var wakeInFlight = false; // guards overlapping navigator.wakeLock.request() calls
  var wakeSentinel = null;  // Backend A: stored so it can actually be released
  var wakeVid = document.getElementById("wakevid");
  var wakeGate = document.getElementById("gate");
  var wakeGateBtn = document.getElementById("gatebtn");

  function acquireAPI() {
    if (wakeInFlight || wakeHeld) return;
    wakeInFlight = true;
    navigator.wakeLock.request("screen").then(function (sentinel) {
      wakeInFlight = false;
      wakeSentinel = sentinel;
      wakeHeld = true;
      sentinel.addEventListener("release", function () {
        wakeHeld = false;
        if (wakeSentinel === sentinel) wakeSentinel = null;
      });
    }).catch(function () {
      wakeInFlight = false;
      // Runtime rejection (e.g. NotAllowedError under an OS power-save mode):
      // degrade to the video backend and raise the gate for its one gesture.
      wakeBackend = "video";
      wakeAwaitingTap = true;
      wakeGate.hidden = false;
    });
  }

  function releaseAPI() {
    if (wakeSentinel) wakeSentinel.release().catch(function () {});
  }

  // Stand in for the loop attribute, which WebKit treats as a disqualifier.
  // Seeking back before the file ends means the element never pauses and
  // never fires "ended", so no engine sees a gap in playback; the 30s asset
  // keeps these seeks rare. The "ended" handler is belt-and-braces for a
  // timeupdate that arrives too late to beat the end of the file.
  var WAKE_LOOP_AT = 25;
  wakeVid.addEventListener("timeupdate", wakeLoopBack);
  wakeVid.addEventListener("ended", wakeLoopBack);
  function wakeLoopBack() {
    if (wakeVid.ended || wakeVid.currentTime > WAKE_LOOP_AT) {
      wakeVid.currentTime = 0;
      if (wakeVid.paused && wakeHeld) {
        var r = wakeVid.play();
        if (r && r.catch) r.catch(function () { wakeHeld = false; });
      }
    }
  }

  function acquireVideo() {
    if (wakeHeld) return;
    wakeVid.muted = !wakeNeedsAudible;
    var p = wakeVid.play();
    wakeHeld = true;
    // A rejected play() means the screen is not actually being held, so
    // wakeHeld must go back to false or syncWake will never retry.
    if (p && p.catch) p.catch(function () { wakeHeld = false; });
  }

  function releaseVideo() {
    wakeVid.pause();
    wakeHeld = false;
  }

  function acquire() {
    if (wakeBackend === "api") acquireAPI();
    else if (wakeBackend === "video") acquireVideo();
  }

  function release() {
    if (wakeBackend === "api") releaseAPI();
    else if (wakeBackend === "video") releaseVideo();
  }

  // Page-lifetime, not stream-lifetime: never reads sseOpen or hubState, so
  // an SSE drop and the retry gap before reconnect keep the screen lit. The
  // only release path is visibilitychange; it re-acquires on the way back.
  function syncWake() {
    if (wakeBackend === "off") return;
    if (wakeBackend === "video" && wakeAwaitingTap) return;
    if (document.visibilityState === "visible") acquire();
    else release();
  }

  // Gate button handler: vid.play() runs synchronously inside the click
  // handler — that's what spends the gesture credit and unlocks the element
  // for later programmatic play()/pause() calls for the rest of the page's
  // life. Then the gate hides for good.
  function arm() {
    // Set the property, not just the attribute: Safari honours only the
    // former reliably, and on WebKit the value has to be false anyway for
    // the element to count as audible.
    wakeVid.muted = !wakeNeedsAudible;
    var p = wakeVid.play();
    if (p && p.catch) p.catch(function () {});
    wakeAwaitingTap = false;
    wakeGate.hidden = true;
    syncWake();
  }
  wakeGateBtn.addEventListener("click", arm);

  if (wakeDisabled) {
    wakeBackend = "off";
  } else if (window.isSecureContext && navigator.wakeLock) {
    wakeBackend = "api";
    syncWake();
  } else {
    wakeBackend = "video";
    wakeAwaitingTap = true;
    wakeGate.hidden = false;
  }

  document.addEventListener("visibilitychange", function () {
    syncWake();
    // Coming back to a tab whose stream died: reconnect now rather than wait
    // out a retry timer the browser may have been throttling while hidden.
    if (document.visibilityState === "visible" &&
        (!es || es.readyState === EventSource.CLOSED)) {
      connect();
    }
  });
})();
</script>
</body>
</html>
